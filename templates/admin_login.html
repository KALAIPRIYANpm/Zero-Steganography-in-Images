{% extends "base.html" %}

{% block content %}
<style>
    .admin-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        padding: 20px;
    }

    .admin-login-card {
        background: white;
        border-radius: 8px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .admin-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .admin-header h2 {
        color: #333;
        font-size: 24px;
        margin-bottom: 5px;
    }

    .admin-header p {
        color: #666;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        background: #f8f9fa;
    }

    .form-control:focus {
        outline: none;
        border-color: #007bff;
        background: white;
    }

    .btn-admin-login {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
    }

    .btn-admin-login:hover {
        background: #0056b3;
    }

    .admin-footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }

    .admin-footer a {
        color: #666;
        text-decoration: none;
        font-size: 14px;
    }

    .admin-footer a:hover {
        color: #007bff;
    }

    .badge {
        display: inline-block;
        padding: 4px 12px;
        background: #dc3545;
        color: white;
        border-radius: 12px;
        font-size: 11px;
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
</style>

<section class="admin-section">
    <div class="admin-login-card">
        <div class="admin-header">
            <h2>Admin Login</h2>
            <p>DNA Image Cryptography System</p>
            <span class="badge">Authorized Access Only</span>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-admin-login">
                Login to Admin Panel
            </button>
        </form>

        <div class="admin-footer">
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
    </div>
</section>
{% endblock %}
