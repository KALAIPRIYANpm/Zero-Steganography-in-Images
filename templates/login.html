{% extends "base.html" %}

{% block content %}
<style>
    /* --- Professional Background Setup --- */
    .login-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        /* Background Image with Dark Overlay */
        background: linear-gradient(135deg, rgba(5, 10, 16, 0.9), rgba(5, 10, 16, 0.8)), 
                    url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        padding: 20px;
        overflow: hidden;
    }

    /* Animated Particles/Glow in background (Optional visual flair) */
    .login-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
        pointer-events: none;
        animation: pulseGlow 5s infinite alternate;
    }

    @keyframes pulseGlow {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 0.8; transform: scale(1.2); }
    }

    /* --- Glassmorphism Card --- */
    .login-card {
        background: rgba(16, 26, 41, 0.75); /* More transparent */
        backdrop-filter: blur(20px);         /* Stronger blur for "frosted glass" look */
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.2); /* Highlight top edge */
        border-radius: 20px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        position: relative;
        z-index: 2;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .login-card:hover {
        transform: translateY(-5px);
        border-color: rgba(0, 242, 255, 0.3);
        box-shadow: 0 30px 60px -12px rgba(0, 242, 255, 0.15);
    }

    /* --- Header Styling --- */
    .login-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .icon-wrapper {
        width: 80px;
        height: 80px;
        background: rgba(0, 242, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        border: 2px solid rgba(0, 242, 255, 0.3);
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
    }

    .login-header h2 {
        color: #fff;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 10px;
        font-size: 1.8rem;
    }

    .login-header p {
        color: #a0aab5;
        font-size: 0.95rem;
        font-weight: 400;
    }

    /* --- Form Styling --- */
    .form-group {
        margin-bottom: 25px;
        position: relative;
    }

    .form-control {
        background: rgba(5, 10, 16, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        height: 55px;
        padding-left: 50px;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-control::placeholder {
        color: #6c757d;
    }

    .form-control:focus {
        background: rgba(5, 10, 16, 0.9);
        border-color: #00f2ff;
        box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1);
        color: #fff;
    }

    .form-icon {
        position: absolute;
        left: 18px;
        top: 18px;
        color: #6c757d;
        font-size: 1.2rem;
        transition: color 0.3s;
    }

    .form-control:focus + .form-icon,
    .form-control:focus ~ .form-icon { 
        color: #00f2ff;
    }

    /* --- Button Styling --- */
    .btn-login {
        width: 100%;
        padding: 16px;
        background: linear-gradient(90deg, #00f2ff, #0072ff);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-top: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .btn-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: 0.5s;
    }

    .btn-login:hover::before {
        left: 100%;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 242, 255, 0.4);
    }

    /* --- Footer Links --- */
    .auth-footer {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-footer p {
        color: #8b9bb4;
        font-size: 0.9rem;
        margin-bottom: 10px;
    }

    .auth-footer a {
        color: #00f2ff;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
    }

    .auth-footer a:hover {
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 242, 255, 0.8);
    }
</style>

<section class="login-section">
    <div class="container d-flex justify-content-center">
        <div class="login-card">
            
            <div class="login-header">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-user-shield fa-2x" style="color: #00f2ff;"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Secure DNA Encryption Gateway</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <input type="text" name="username" class="form-control" placeholder="Username" required autocomplete="off">
                    <i class="fa-solid fa-user form-icon"></i>
                </div>

                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <i class="fa-solid fa-lock form-icon"></i>
                </div>

                <button type="submit" class="btn btn-login">
                    Initialize Session <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>New to SecureBinary?</p>
                <a href="{{ url_for('register') }}">Create an Encrypted Account</a>
                <div style="margin-top: 15px;">
                    <a href="{{ url_for('home') }}" style="color: #6c757d; font-size: 0.85rem;">
                        <i class="fa-solid fa-chevron-left me-1"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
